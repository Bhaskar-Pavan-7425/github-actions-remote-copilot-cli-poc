name: Remote Copilot Code Fix

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  remote-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::660430196073:role/GitHubActions-RemoteCopilot-SSM
          aws-region: us-east-1

      - name: Prepare SSM parameters
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json, os, shlex; token=shlex.quote(os.environ["GITHUB_TOKEN"]); command="""sudo -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GITHUB_TOKEN=%s bash -lc '\''set -e; REPO_DIR=/home/ubuntu/github-actions-remote-copilot-cli-poc; rm -rf "$REPO_DIR"; git clone --branch dev https://github.com/Bhaskar-Pavan-7425/github-actions-remote-copilot-cli-poc.git "$REPO_DIR"; cd "$REPO_DIR"; git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/Bhaskar-Pavan-7425/github-actions-remote-copilot-cli-poc.git"; echo "===== Repository ====="; pwd; echo "===== Branch ====="; git branch --show-current; echo "===== Files ====="; ls -la; echo "===== Running Copilot ====="; copilot -p "Analyze calculator.py and test_calculator.py. Identify the actual coding issue. Fix the root cause in calculator.py. Do not modify the test unless the test itself is incorrect. After making the fix, run the relevant Python test. Verify that the test passes. Make only the necessary code changes." --allow-tool=write --allow-tool="shell(python:*)" --no-ask-user; echo "===== Copilot finished ====="; echo "===== Running test ====="; python -m unittest test_calculator.py; echo "===== Git diff ====="; git diff; echo "===== Git status ====="; git status; if git diff --quiet; then echo "ERROR: Copilot did not modify the code."; exit 1; fi; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add calculator.py; git commit -m "fix: resolve calculator issue"; git push origin dev; echo "===== FIX PUSHED SUCCESSFULLY ====="'\''""" % token; json.dump({"commands":[command]},open("/tmp/ssm-parameters.json","w"))'

          echo "SSM parameters prepared."

      - name: Execute remote Copilot code fix
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-07e0d7af398cb121d \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          echo "Waiting for remote Copilot..."

          for i in {1..180}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-07e0d7af398cb121d \
              --query "Status" \
              --output text)

            echo "Status: $STATUS"

            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              break
            fi

            sleep 2
          done

          echo ""
          echo "================ STDOUT ================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "StandardOutputContent" \
            --output text

          echo ""
          echo "================ STDERR ================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "StandardErrorContent" \
            --output text

          echo ""
          echo "================ FINAL STATUS ================"

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "Status" \
            --output text)

          echo "Final status: $FINAL_STATUS"

          if [[ "$FINAL_STATUS" != "Success" ]]; then
            exit 1
          fi

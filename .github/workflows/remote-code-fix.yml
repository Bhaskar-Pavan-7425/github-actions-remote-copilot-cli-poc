name: Remote Copilot Code Fix

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  remote-fix:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Configure AWS credentials using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::660430196073:role/GitHubActions-RemoteCopilot-SSM
          aws-region: us-east-1

      # ---------------------------------------------------------
      # 2. Prepare the SSM command
      # ---------------------------------------------------------
      - name: Prepare SSM command
        run: |
          cat > /tmp/ssm-parameters.json <<'EOF'
          {
            "commands": [
              "sudo -u ubuntu env HOME=/home/ubuntu PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/bin bash -lc 'set -e; REPO_DIR=/home/ubuntu/Copilot_CLI/github-actions-remote-copilot-cli-poc; rm -rf \"$REPO_DIR\"; git clone --branch dev https://github.com/Bhaskar-Pavan-7425/github-actions-remote-copilot-cli-poc.git \"$REPO_DIR\"; cd \"$REPO_DIR\"; echo \"===== REPOSITORY =====\"; pwd; echo \"===== BRANCH =====\"; git branch --show-current; echo \"===== FILES =====\"; ls -la; echo \"===== RUNNING COPILOT =====\"; copilot -p \"Analyze calculator.py and test_calculator.py. Identify the actual coding issue. Fix the root cause in calculator.py. Do not modify the test unless the test itself is incorrect. After making the fix, run the relevant Python test and verify that it passes. Make only the necessary code changes.\" --allow-tool=write --allow-tool=\"shell(python3:*)\" --no-ask-user; echo \"===== COPILOT FINISHED =====\"; echo \"===== RUNNING TEST =====\"; python3 -m unittest test_calculator.py; echo \"===== GIT DIFF =====\"; git diff; echo \"===== GIT STATUS =====\"; git status; if git diff --quiet; then echo \"ERROR: Copilot did not modify the code.\"; exit 1; fi; git config user.name \"github-actions[bot]\"; git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"; git add calculator.py; git commit -m \"fix: resolve calculator issue\"; git push origin dev; echo \"===== FIX PUSHED SUCCESSFULLY =====\"'"
            ]
          }
          EOF

          echo "SSM command prepared."

      # ---------------------------------------------------------
      # 3. Send command to the new EC2 instance
      # ---------------------------------------------------------
      - name: Send command to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0952e02b9493d14b7 \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "Waiting for remote Copilot..."

          # -----------------------------------------------------
          # 4. Wait for SSM command to complete
          # -----------------------------------------------------
          for i in {1..180}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0952e02b9493d14b7 \
              --query "Status" \
              --output text)

            echo "Status: $STATUS"

            if [[ "$STATUS" == "Success" || \
                  "$STATUS" == "Failed" || \
                  "$STATUS" == "Cancelled" || \
                  "$STATUS" == "TimedOut" ]]; then
              break
            fi

            sleep 2
          done

          # -----------------------------------------------------
          # 5. Display remote command output
          # -----------------------------------------------------
          echo ""
          echo "================ STDOUT ================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0952e02b9493d14b7 \
            --query "StandardOutputContent" \
            --output text

          echo ""
          echo "================ STDERR ================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0952e02b9493d14b7 \
            --query "StandardErrorContent" \
            --output text

          # -----------------------------------------------------
          # 6. Check final status
          # -----------------------------------------------------
          echo ""
          echo "================ FINAL STATUS ================"

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0952e02b9493d14b7 \
            --query "Status" \
            --output text)

          echo "Final status: $FINAL_STATUS"

          if [[ "$FINAL_STATUS" != "Success" ]]; then
            exit 1
          fi

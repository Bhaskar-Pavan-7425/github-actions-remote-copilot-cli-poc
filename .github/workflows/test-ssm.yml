name: Test Remote SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::660430196073:role/GitHubActions-RemoteCopilot-SSM
          aws-region: us-east-1

      - name: Test existing Copilot CLI
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-07e0d7af398cb121d \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -iu ubuntu bash -lc '\''source ~/.bashrc 2>/dev/null || true; NPM_PREFIX=$(cat ~/.npmrc 2>/dev/null | grep "^prefix=" | cut -d= -f2-); export PATH="$NPM_PREFIX/bin:$PATH"; echo USER=$(whoami); echo NPM_PREFIX=$NPM_PREFIX; echo COPILOT_PATH=$(command -v copilot); copilot --version'\''"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          echo "Waiting for EC2 command to complete..."

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-07e0d7af398cb121d \
              --query "Status" \
              --output text)

            echo "Status: $STATUS"

            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              break
            fi

            sleep 2
          done

          echo ""
          echo "===== STDOUT ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "StandardOutputContent" \
            --output text

          echo ""
          echo "===== STDERR ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "StandardErrorContent" \
            --output text

          echo ""
          echo "===== STATUS ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "{Status:Status,ResponseCode:ResponseCode}" \
            --output table

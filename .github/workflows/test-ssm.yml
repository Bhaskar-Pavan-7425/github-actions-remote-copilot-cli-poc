name: Test Remote SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::660430196073:role/GitHubActions-RemoteCopilot-SSM
          aws-region: us-east-1

      - name: Find and test existing Copilot CLI
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-07e0d7af398cb121d \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -iu ubuntu bash -lc '\''echo USER=$(whoami); echo HOME=$HOME; echo PATH=$PATH; echo Searching for Copilot...; COPILOT=$(find /home/ubuntu -type f -name copilot -perm -111 -print -quit 2>/dev/null); echo COPILOT_PATH=$COPILOT; if [ -n \"$COPILOT\" ]; then echo Running Copilot...; \"$COPILOT\" --version; else echo COPILOT_NOT_FOUND; exit 1; fi'\''"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          echo "Waiting for EC2 command to complete..."

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-07e0d7af398cb121d \
              --query "Status" \
              --output text)

            echo "Status: $STATUS"

            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              break
            fi

            sleep 2
          done

          echo ""
          echo "===== STDOUT ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "StandardOutputContent" \
            --output text

          echo ""
          echo "===== STDERR ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "StandardErrorContent" \
            --output text

          echo ""
          echo "===== STATUS ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "{Status:Status,ResponseCode:ResponseCode}" \
            --output table

name: Test Remote SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::660430196073:role/GitHubActions-RemoteCopilot-SSM
          aws-region: us-east-1

      - name: Test existing Copilot CLI
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-07e0d7af398cb121d \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu -H bash -lc '\''whoami; which copilot; copilot --version'\''"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07e0d7af398cb121d \
            --query "StandardOutputContent" \
            --output text
